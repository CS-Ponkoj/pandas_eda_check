name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=7"

      - name: Run tests
        run: python -m pytest

  build:
    name: Verify and build distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install verification tooling
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              package_version = tomllib.load(file)["project"]["version"]

          event_name = os.environ["EVENT_NAME"]
          if event_name == "workflow_dispatch":
              print(
                  "Manual run: skipping tag-version verification; "
                  "publishing is disabled."
              )
          else:
              tag_name = os.environ["TAG_NAME"]
              tag_version = (
                  tag_name[1:] if tag_name.startswith("v") else tag_name
              )
              if tag_version != package_version:
                  raise SystemExit(
                      "Release tag does not match the package version.\n"
                      f"Tag version: {tag_version}\n"
                      f"Package version: {package_version}"
                  )
              print(
                  f"Verified tag version {tag_version} matches "
                  f"package version {package_version}."
              )
          PY

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  publish:
    name: Publish distribution to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pandas-eda-check
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
