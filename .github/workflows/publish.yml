name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=7"

      - name: Run tests
        run: python -m pytest

  build:
    name: Verify and build distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install verification tooling
        run: python -m pip install --upgrade build twine

      - name: Verify release version and event
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          EXPECTED_VERSION: "0.2.0"
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]

          expected_version = os.environ["EXPECTED_VERSION"]
          if version != expected_version:
              raise SystemExit(
                  f"Package version {version!r} does not match the expected "
                  f"release version {expected_version!r}."
              )

          event_name = os.environ["EVENT_NAME"]
          expected_tag = f"v{version}"
          if event_name == "push" and os.environ["TAG_NAME"] != expected_tag:
              raise SystemExit(
                  f"Tag {os.environ['TAG_NAME']!r} does not match package "
                  f"version {version!r}. "
                  f"Expected {expected_tag!r}."
              )

          print(f"Verified package version {version}.")
          if event_name == "workflow_dispatch":
              print("Manual run: build and verification only; publishing is disabled.")
          PY

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  publish:
    name: Publish distribution to PyPI
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.2.0'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pandas-eda-check
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
